name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # GitHub-hosted macOS runner; no Apple Developer account or secrets required.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile unsigned iOS app
        run: |
          xcodebuild build \
            -project EduMaurice.xcodeproj \
            -scheme EduMaurice \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphoneos/EduMaurice.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../EduMaurice-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: EduMaurice-unsigned-ipa
          path: build/EduMaurice-unsigned.ipa
          retention-days: 14
